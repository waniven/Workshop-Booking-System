version: '3.8'

services:
  # 1. MongoDB Database Service
  database:
    image: mongo:7.0
    container_name: mongodb_container
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. Node.js Backend Service
  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://database:27017/workshop
    depends_on:
      - database

  # 3. React Frontend Service
  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "3001:5173" 
    environment:
      - REACT_APP_API_URL=http://localhost:3000
    depends_on:
      - backend

# Named volume to ensure your data stays persistent when containers restart
volumes:
  mongo-data:
